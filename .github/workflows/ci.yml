name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 编译 + 单测
        # 语料 / 性能 / 真档依赖用例由 ERATW_* 环境变量门控，CI 上无变量即自动不生成，
        # 计入的只有自足的 fixture 用例（fixtures/golden 等）。
        run: ./gradlew --no-daemon :core-vm:test :render:test :tools:erbcc:test :tools:vmdbg:test :tools:uipreview:test
