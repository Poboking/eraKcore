# ---- A9 补注（CATCH）+ 全 ISA 的关键不变量 ----
# 【不变量：ProcessState.JumpTo(X) 的实际效果是"从 X **之后**的那一行继续执行"】
#   主循环是 `do { IL_0000: state.ShiftNextLine(); ...读取 CurrentLine 并执行... } while(...)`
#   （Process.cs:1006-1081，ShiftNextLine 在 :1011，取行在 :1016；JumpTo 只写 currentLine 不做前进，ProcessState.cs:129-133）。
#   ⇒ 每次 JumpTo 之后回到循环顶都会先前进一行。交叉验证三处：
#     · GOTO $TAIL → JumpTo(labelLine)（FunctionIdentifier.cs:3716）落在 label 之后 = 标签体首行 ✓
#       （且主循环遇 GotoLabelLine 本身也是 `goto IL_0000` 再前进，Process.cs:1068-1071）
#     · CALL 的返回地址 = **CALL 语句行自己**（CalledFunction.CallFunction(..., retAddress=func) :3531/:3575；
#       ProcessState.Return 把 currentLine = ReturnAddress，ProcessState.cs:289-310）→ 落在 CALL 之后 ✓
#     · BREAK：func.JumpTo=头行，head.JumpTo=尾行（ErbLoader.cs:1335-1336 双向互指），
#       state.JumpTo(尾行)（FunctionIdentifier.cs:3313/3318）→ 落在 REND/WEND/LOOP 之后 = 循环出口 ✓
#   ⇒ **移植侧编码规则**：VM/语句层的 StmtOutcome.Transfer(pc) 是绝对跳转，而原版每个 JumpTo 目标隐含 +1。
#     具体到本条目：TRYC 行上的 JumpToEndCatch = **CATCH 行** ⇒ 效果是"CATCH 之后" = handler 块首行（handler 确实执行）；
#     CATCH 行上的 JumpToEndCatch = **ENDCATCH 行** ⇒ 效果是"ENDCATCH 之后" = 整个构造之后。
#     若 CATCH 在字节码里仍是一条真语句（Opcode.CATCH），A5 必须按 `pc(CATCH)+1` / `pc(ENDCATCH)+1` 发射，
#     否则会整体错位一行（与契约 C4 的 Transfer 口径核对）。
#   ⇒ **同一主循环里的两种"前进"口径**（移植侧必须区分）：
#     · 语句 DoInstruction 什么都不做（return） ⇒ 循环自身 ShiftNextLine ⇒ 只跳过**自己这一行**（TRYCALL 缺失即此）。
#     · 语句内部**主动**调用 state.ShiftNextLine()（ProcessState.cs:123-127，公开方法）⇒ 额外消耗一行 —— SIF 用这一招跳过
#       紧随的一条语句（FunctionIdentifier.cs:3072-3078，条件为假时 ShiftNextLine()），**不是**用装载期算好的 func.JumpTo
#       （:3055 的 JumpTo 只服务 :3066-3069 的"空行后 SIF"告警，运行期无人读取）。
#     · 语句调用 state.JumpTo(X) ⇒ 从 X **之后**继续（见上方不变量）。
#   契约 C4 的 StmtOutcome 只有 Normal/Transfer/Stop，缺"跳过后续 N 行"这一档；SIF/TRYC 都用 Transfer(pc+…) 表达即可，
#   但 A5 落 SIF 时必须按"目标+1"口径核对，否则会多跳一行。
# 结构配对（装载期，ErbLoader.cs）：TRYC* 入栈 :1169-1178；CATCH :1339-1349（栈顶必须是六个 TRYC* 之一，
#   否则 Warn(MissingTryc) :1341-1345；`trycLine.JumpToEndCatch = catchLine` :1347；catchLine 入栈 :1348）；
#   ENDCATCH :1350-1358（栈顶必须是 CATCH；`catchLine.JumpToEndCatch = endcatchLine` :1357）。
#   ⇒ 同一个 JumpToEndCatch 字段在 TRYC 行与 CATCH 行上是**两种不同用途**，语句层不可统一处理。
# CATCH 本体只有 `state.JumpTo(func.JumpToEndCatch)`（FunctionIdentifier.cs:3282-3285）——它是"正常路径跳过 handler"的分隔符，
#   不是 handler 的入口；handler 由 TRYC 行的失败跳转进入。
