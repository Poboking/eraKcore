#   （fornext=true 才换 SP_FOR_NEXT 并 flag|=2，:2988-2992）。
# 循环变量 = **真变量本身，每次迭代走一次读+一次写**，没有内部计数器/寄存器：
#   REPEAT_Instruction.DoInstruction :2999-3010 把 `func.LoopCounter = spForNextArgment.Cnt`（:3002，
#   Cnt 是 VariableTerm，SpForNextArgment.cs:8）——**状态挂在循环头那一行**（InstructionLine.LoopCounter
#   InstructionLine.cs:54-64），LoopEnd/LoopStep 是头行上的 long（:66-76）。
#   REND/NEXT :3393-3407：取 instructionLine = func.JumpTo（=头行，装载期双向互指 ErbLoader.cs:1335-1336）→
#   instructionLine.LoopCounter.**ChangeValue**(LoopStep, exm)（:3401，对变量做 += 步长，含下标变量的读写）→
#   GetIntValue 回读（:3402）→ 判定（:3403）→ state.JumpTo 回边或落到下一行。
#   ⇒ 移植侧：LoopCounter 必须落 VariableStore（契约 C1）；且**循环体内部对循环变量的写入会被 NEXT 覆盖**（原版行为）。
# Start / End / Step **各只求值一次**，都在头行执行：:3003 Start、:3004 End、:3005 Step（GetIntValue 各一次）。
#   ⇒ **非常量步长不会逐迭代重算**；`FOR A,0,10,STEPVAR` 改 STEPVAR 不影响已开循环。
# 判定式（负步长支持点，两处，均在 FunctionIdentifier.cs，不在 For_Instruction）：
#   入口"初始条件不满足直接跳到循环尾" = :3006
#     `if ((step <= 0 || end <= cnt) && (step >= 0 || end >= cnt)) state.JumpTo(func.JumpTo)`
#     —— step>0 需 end>cnt 才进入；step<0 需 end<cnt 才进入；**step==0 两子句同时为真 ⇒ 恒跳过，循环体 0 次**。
#   续跑判定 = :3403 `(step > 0 && end > val) || (step < 0 && end < val)`
#     ⇒ **上界(或下界)是排他的**：`FOR A, 0, 5, 1` 跑 A=0..4 共 5 次（不是 6 次），终值 A==5；
#        `FOR A, 5, 0, -1` 跑 A=5..1 共 5 次，终值 A==0。REPEAT 同理（0..n-1）。
# REPEAT 的改写位置 = **实参构造器内**，不是语句实现内：ArgumentParser.cs:1213-1229（INT_EXPRESSION_ArgumentBuilder 的
#   REPEAT 特例）：禁止 COUNT 被 forbid（:1215-1218）、常量 <=0 只给 level0 告警（:1219-1222），
