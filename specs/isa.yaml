# ---- A9：CALL 家族全形态清单（操作数编码 + try/TRYC 语义定稿）----
# 主实现类只有 4 个：CALL_Instruction（FunctionIdentifier.cs:3489-3600）、
#   GOTO_Instruction（:3629-3719）、CALLEVENT_Instruction（:3602-3627）、
#   CALLF_Instruction / TRYCALLF_Instruction（:1101-1167 / :1237-1287）；**不存在 JUMP_Instruction**。
# 构造参数 = (form, isJump, isTry, isTryCatch)，注册表 FunctionIdentifier.cs:4040-4051（CALL 族）与
#   :4057-4062（GOTO 族）。逐形态（全部 12+6 条，无遗漏）：
#   JUMP         form=0 jump=1 try=0 tryc=0  CALL_Instruction  flag 33|64 =97          +addFlag 0
#   CALL         0,0,0                       CALL_Instruction  flag 33      =33         +0
#   TRYJUMP      0,1,1,0                     CALL_Instruction  33|64|128    =225        +2
#   TRYCALL      0,0,1,0                     CALL_Instruction  33|128       =161        +2
#   JUMPFORM     1,1,0                       CALL_Instruction  97                        +2
#   CALLFORM     1,0,0                       CALL_Instruction  33                        +2
#   TRYJUMPFORM  1,1,1,0                     225 +2 ; TRYCALLFORM 161 +2
#   TRYCJUMP     0,1,1,1                     CALL_Instruction  33|64|128|32784 =33505    +2
#   TRYCCALL     0,0,1,1                     33|128|32784      =33297   +2
#   TRYCJUMPFORM 1,1,1,1 / TRYCCALLFORM 1,0,1,1 同上两组位模式（form 只换 ArgBuilder，不改 flag）
#   GOTO         form=0 try=0 tryc=0         GOTO_Instruction  flag 37      =37         +0
#   TRYGOTO      0,1,0                       37|128            =165   +2
#   GOTOFORM     1,0,0                       37                =37    +2
#   TRYGOTOFORM  1,1,0                       165               +2
#   TRYCGOTO     0,1,1                       37|128|32784      =33285 +2
#   TRYCGOTOFORM 1,1,1                       同上
#   CALLF / CALLFORMF     -> CALLF_Instruction(form)  FunctionIdentifier.cs:1101-1167  flag 38（:4053-4054，无 additionalFlag）
#   TRYCALLF/TRYCALLFORMF -> TRYCALLF_Instruction(form) :1237-1287                     flag 38（:4105-4106）
#   **TRYCALLF 的 flag 与 CALLF 完全相同（都是 38，不含 IS_TRY=128）** —— try 性只体现在 Instruction 实现类上，
#     不能从 flag 位推出（对比 :4290-4308 只有 IsTry()/IsJump()）。.erbc 若要按 flag 编码必须另存位。
#   CALLEVENT -> CALLEVENT_Instruction（:3602-3627）flag 3，ArgType.STR（常量事件名，无实参槽）。
# 参数面（三槽，ArgumentParser.cs:719-792 / SpCallArgment.cs:8-22 / SpCallFArgment.cs:8-21）：
#   FuncnameTerm（SP_CALL=常量串 :730 / SP_CALLFORM=FORM 串 :725）、SubNames（`[...]` 列表）、RowArgs（`(...)`/`,` 列表）。
#   **SubNames 在运行期从不被读取**：全仓仅 ErbLoader.cs:1506 与 :1511 校验 TRYGOTOLIST 成员的 SubNames/RowArgs 必须为空；
#   CALL/GOTO/CALLF 的 DoInstruction 只用 RowArgs。故 .erbc 的 CALL 操作数 = 名字(常量或 1 表达式) + n 实参，SubNames 可丢弃但需保留"非空即装载期报错"校验位。
# 结果落点：CALL/JUMP/GOTO/CALLEVENT/TRYCALL* -> 不写 RESULT（DoInstruction 无 SetResult，:3560-3599/:3618-3626/:3681-3717）；
#   CALLF/TRYCALLF -> `aExpression.GetValue(exm)` 求值后**丢弃**（:1165 / :1285），不写 RESULT/RESULTS；
#   CALLSHARP -> 变量实参回写（:1218-1233）。RETURN 写 RESULT/RESULTS（:3260-3270），RETURNF 走 state.ReturnF(SingleTerm)（:3477-3486）。
# **try"查不到"到底是跳过哪一行 —— 定稿：跳过本行（顺序执行下一条），不是跳过下一行。**
#   CALL 族 FunctionIdentifier.cs:3577-3588：calledFunction==null 时
#     !isTry -> throw CodeEE（:3581）；isTry -> 仅当 func.JumpToEndCatch != null 才 state.JumpTo（:3583-3586），随后 `return`（:3587）
#     ；调用方主循环对 return 一律 ShiftNextLine（Process.cs:1011/1021-1057）⇒ 落到**紧随其后的那一行**。
#   GOTO 族同构：:3699-3709（!IsTry -> throw :3703；IsTry -> JumpToEndCatch 或什么都不做），
#     装载期常量标签缺失时 GOTO_Instruction.SetJumpTo 只在非 try 上报解析错（:3664-3670），
#     运行期 const 且 func.JumpTo==null 直接 return（:3688-3691）= 同样跳过本行。
#   TRYCALLF：装载期 catch-all 静默返回（:1264-1267），运行期 `aExpression?.GetValue(exm)`（:1285）= 空操作，同样跳过本行。
