# 注册面由各条目 aliases 承载。tools/spec_crosscheck.py 逐条核对「C# 确有 <条目名>_Instruction 实现类
# 且 aliases 里至少一个注册名（METHOD 例外：注册面是方法并入循环）」后才计入 --section 的
# 「已解释（非缺口）」块，并印出类声明行与注册行；缺登记、或登记了但 C# 无该类，照旧报「别名与大小写口径」缺口。
