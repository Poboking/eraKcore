# ---- A9 isa-evidence 勘误/操作数面注记（2026-10-20，均给 文件:行号）----
# PRINT 后缀语法是**有序单遍解析**（PRINT_Instruction 构造器 FunctionIdentifier.cs:85-171）：
#   PRINT [SINGLE] [V|S|FORMS|FORM] [LC|C] [K] [D] [N] [L|W]，任一时刻只匹配一组；
#   解析后 charStream 非 EOS 即抛 ExeEE（:167-170）—— 因此合法后缀组合是唯一真值集，
#   注册表 FunctionIdentifier.cs:3830-3901 + 4130-4134 的 71 个名字就是全部形态。
# 操作数面（.erbc 真编码依据，只有 1 个槽位是文本/表达式，其余全在语句名里）：
#   无 V/S/FORM 前缀   -> STR_NULLABLE   : 0 表达式 + 1 常量字符串（ArgumentParser.cs:446-476，IsConst=true）
#   FORM               -> FORM_STR_NULLABLE: 1 个「格式化串项」= 源文本内 {表达式} 装载期展开（ArgumentParser.cs:488-513）
#   S                  -> STR_EXPRESSION  : 1 个字符串型表达式（ArgumentParser.cs:1320-1336，省略时补 "" 常量）
#   V                  -> SP_PRINTV       : 0..n 个表达式，逐项 int/str 拼接（ArgumentParser.cs:312-325 / FunctionIdentifier.cs:186-201）
#   FORMS              -> STR_EXPRESSION + isForms（FunctionIdentifier.cs:106-111）：**两步语义** ——
#                        先把表达式求值成字符串，再对该字符串 CheckEscape + 按 FORM 二次展开（:205-209）。
#                        即 {} 来自字符串**值**而非源文本，与 FORM 不可互换；.erbc 需单独标记该二次展开位。
# 标志位口径（位定义 FunctionIdentifier.cs:3721-3753，读接口 :4230-4288）：
#   L -> 256|4 ; W -> 512|256 ; N -> 512（见下条勘误）; K -> 4096|2 ; D -> 2048|2 ; SINGLE -> 1024|2 ; LC/C -> 2
#   即 bit2(EXTENDED) 在 PRINT 家族里表示"名字含 SINGLE/LC/C/K/D 任一"，与 IsExtended() 复用，不是对齐方向位；
#   对齐方向只存在于 isC/isLC 私有字段（FunctionIdentifier.cs:215-222，C=右对齐、LC=左对齐），装载期无位可存。
#   PRINTC/PRINTLC 的**定宽宽度不是操作数**：取 Config.PrintCLength 全局（EmueraConsole.cs:3237-3244）。
# 勘误（原条目"N=不换行且下次可跳过"与代码不符）：N 分支同时置 isLineEnd=false **和** flag|=512(PRINT_WAITINPUT)
#   （FunctionIdentifier.cs:146-151），而 OutputToConsole 在 IsWaitInput() 为真时执行 NewLine()+ReadAnyKey()
#   （ExpressionMediator.cs:58-65，NewLine 定义 EmueraConsole.cs:3333-3337）。
#   ⇒ PRINTN/PRINTVN/PRINTSN/PRINTFORMN/PRINTFORMSN 实测**会结束当前行并等待按键**，
#     行为近乎 PRINTW，与文档化的"不换行"相反。按 ADR-005 原样复刻。
#     TODO(verify): Print(str, lineEnd=false) 与 true 在换行**次序**上的差异需实机对拍确认（文字流终态一致）。
- name: PRINT
  kind: display
  arg_form: 'varies by alias: STR_NULLABLE / STR_EXPRESSION / FORM_STR_NULLABLE / SP_PRINTV'
  semantics: PRINT 家族统一实现:按语句名后缀决定行为——V=逐项输出表达式,S=输出字符串表达式,FORM=展开文本中 {表达式},FORMS=先求值为字符串再对该字符串二次按 FORM 展开,K=字符串类型转换,D=使用调试配色,SINGLE=单行独立显示,C/LC=右/左对齐定宽输出(宽度取 Config.PrintCLength,非操作数),L=末尾换行,W=末尾换行并等待按键,N=语句名不换行但实现同时置 PRINT_WAITINPUT,故实际仍换行并等待按键(见 source 注释块勘误)。SkipPrint 期间整条跳过。
  errors: 语句名解析失败时抛 ExeEE(构造期)。
  display_effect: 向控制台文字流追加文本;可能换行、触发按键等待;受消息跳过(SkipPrint)抑制。
