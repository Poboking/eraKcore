  - {name: FLAG,      index: 3,  size: 10000, saved: true, global: false, source: "VariableData.cs:3017; ConstantData.cs:216"}
  - {name: TFLAG,     index: 4,  size: 1000, saved: true,  global: false, source: "VariableData.cs:3018", note: "index 4 < 60 ⇒ 经典存档覆盖 (VariableToken.cs:141-146; VariableData.cs:3526-3529)"}
  - {name: UP,        index: 5,  size: 1000, saved: true,  global: false, source: "VariableData.cs:3019"}
  - {name: PALAMLV,   index: 6,  size: 1000, saved: true,  global: false, source: "VariableData.cs:3020", note: "默认值取 Config.PalamLvDef (VariableData.cs:3485-3487)"}
  - {name: EXPLV,     index: 7,  size: 1000, saved: true,  global: false, source: "VariableData.cs:3021", note: "默认值取 Config.ExpLvDef (VariableData.cs:3488-3490)；size 是出厂值 1000 (ConstantData.cs:212-215)，本语料 CSV/VariableSize.csv:33 写 EXPLV,200 ⇒ 实读 200（改写链 ConstantData.cs:309-551 的 changeVariableSizeData：名字表槽走 :487 写 MaxDataList，全局 1 维整数走 :539 写 VariableIntArrayLength）；EXPLV 不在 23 组主数组↔名字表联动里 (ConstantData.cs:585-607 无它)，长度只有出厂/CSV 两条路。语料以 EXPLV:(能力值+1..+3) 形态索引它 (fromEN/NEW_UPDATE/UPDATE_MAIN.ERB:284、fromEN/MISC.ERB:1716-1902、DLC/魔法DLC/魔法相关函数.ERB:280-303)，能力值 >197 即越界 ⇒ 原版同样抛 CodeEE (Array 索引抛 → CheckElement 术语化 VariableData.cs:81-87，表达式层原样重抛 VariableTerm.cs:57-78 / FixedVariableTerm.cs:65-79)，只由 Process.DoScript 顶层 catch 吞成屏上错误 (Process.cs:462-477 → handleException :595-660，PrintErrorButton 见 EmueraConsole.cs:1097/:3118) 后继续跑 ⇒ 官方同判，不改引擎、不放宽 checkFlat"}
