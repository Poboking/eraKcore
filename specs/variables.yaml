# 保存标记勘误（2026-10-17，m2-vars 实现时发现，以源码为准）
# variables.yaml 上方各条目的 saved 列与源码 IsSavedata 规则有 4 处不一致。
# 实现已按源码（VariableCode.cs / VariableToken.cs:88-154）执行，下方标注差异：
#   1) STR   : yaml saved=true  → 源码 false（低16位=1 不满足 <1 的保存门槛）
#   2) TSTR  : yaml saved=false → 源码 true （带 SAVE_EXTENDED 标志）
#   3) CDFLAG: yaml 未标        → 源码 true （0x19130000 含 SAVE_EXTENDED）
#   4) SAVEDATA_TEXT: yaml true → 源码 false（EXTENDED 分支直接 return，疑只走文本扩展段 GetExtSaveList）
# 待 M4 用二进制存档样本核对后回填本文件（尤其第 4 条）。
