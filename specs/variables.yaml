  - note: "LOCAL/ARG 尺寸可被函数定义中的参数声明拉大: resizeLocalVars (LabelDictionary.cs:66-67); 函数局部变量在每次 SetDefaultLocalValue 清零 (VariableData.cs:3365-3375), 每文件加载后 ClearLocalValue (VariableData.cs:3377-3383)"

# 浮点变量（fork 新增类型；证据源 fork-src = qirchen421/emuera.sk@48494165 develop-skiasharp, 2026-08-28）
# 取证等级 A(fork-src): 下列行号均指该 fork 仓库文件，不是 reference/emuera-cs 的 1.824 快照。
float_vars:
  storage: "存储四件套: dataFloat(double[])、dataFloatArray(double[][])、dataFloatArray2D(double[][,])、dataFloatArray3D(double[][,,]) (VariableData.cs:26,29,32,35)；构造时 dataFloat 长度复用 __COUNT_STRING__(=2)、dataFloatArray 长度复用 __COUNT_STRING_ARRAY__(=7)，各槽先置空数组 (VariableData.cs:155-160)；2D/3D 为空容器 (VariableData.cs:159-160)；SetDefaultValue 只把 dataFloat 全部清 0.0 (VariableData.cs:668-669)"
  scalars:
    - {name: RESULTF, dim: 0, index: 1, saved: false, source: "fork-src VariableData.cs:182; VariableCode.cs:124; VariableToken.cs:947-971", note: "浮点标量，实际是 dataFloat[VarCodeInt=1] 的标量包装 (FloatScalarVariableToken GetFloatValue/SetValue, VariableToken.cs:956-969)；读写入口 VariableEvaluator.RESULTF (VariableEvaluator.cs:3105-3108)；由 METHOD 语句按表达式类型写入 (Instraction.Child.cs:613-629, 浮点分支 :626)；RETURNF 不写 RESULTF，而是把返回值塞进 MethodReturnValue (Process.State.cs:762-787)；带 __EXTENDED__ ⇒ IsSavedata=false (VariableToken.cs:51-55)"}
  dimf: "#DIMF：仅 1 维；2D/3D/0 维一律 ExeEE(AbnormalVarDeclaration) (VariableData.cs:469-474 全局/静态, :553-559 私有静态, :585-591 私有动态)；#REFF 仅标量 (VariableData.cs:451-456, 519-526)；#DIMF 与 CONST/GLOBAL/SAVEDATA/STATIC/DYNAMIC 的关键字互斥规则与整数一致，无浮点专属限制 (UserDefinedVariable.cs:91-264)；初值表接受浮点或整数常量，整数按 double 存 (UserDefinedVariable.cs:317-338)"
  dimf_chara_quirk: "#DIMF CHARADATA 未建浮点 token：CreateUserDefCharaVariable 只有 TypeIsStr 与 else(整数) 两支，浮点会掉进整数分支 (VariableData.cs:410-429) ⇒ fork 行为疑似 bug，按 ADR-005 需原样复刻并记录 (TODO(verify) 待语料或真机确认)"
  dimf_default_value: "初值 DefaultFloat 是单值 (UserDefinedVariable.cs:21，区别于 DefaultInt[]/DefaultStr[]) ⇒ #DIMF X, n = v 把 v 广播到全部 n 格；初值表接受浮点或整数常量、整数按 double 存 (:317-338)；无初值 = 0.0 (VariableData.cs:668-669)；多值 = 1.5, 2.5 无第二槽，声明期 CodeEE 拒绝 (TODO(verify) 待真机对拍)"
  localfsize: "#LOCALFSIZE n 按函数覆盖 LOCALF/ARGF 出厂长度 10 (fork-src LogicalLineParser.cs:257-266、ConstantData.cs:211-217)；移植侧有效长度 = max(VARSIZE 浮点档(出厂10), #LOCALFSIZE, ARGF 形参声明长)；下标判界在 Long 域 (LocalVariableToken.cs:39-45)；VARIABLESIZE.CSV 的浮点档已移植 (见本段 varsize_csv)。⚠ 与 fork 的两处口径差（[g9] 2026-10-31 按锚点 48494165 逐行实测，待组长裁决）：① fork 的 ARGF 只读 func.ArgFloatLength (VariableLocal.cs:48-49)，#LOCALFSIZE 记在 func.LocalFloatLength 上 (LogicalLineParser.cs:257-266)，两者**不互相抬界** ⇒ 严格照抄应为 max(VARSIZE 档, 形参声明长)；② fork 的下界钳制名单只有 ARG/ARGS/ARGF (VariableLocal.cs:52-53)，**不含 LOCALF** ⇒ 非事件函数里 #LOCALFSIZE 4 是缩到 4，只有事件函数在分组时抬到档位 (LabelDictionary.cs:155-173, 226-253)；本仓整数侧 resolveLocalSize 已是 fork 口径 (ARG/ARGS 取 max、LOCAL/LOCALS 声明优先可缩)"
  varsize_csv: "VARIABLESIZE.CSV 的浮点档 [g9 2026-10-31 移植完成]：表本体 VariableFloatArrayLength，长度 __COUNT_FLOAT_ARRAY__ = 2 ⇒ 只有 LOCALF(槽0)/ARGF(槽1) 两个名字可改 (fork-src ConstantData.cs:106、VariableCode.cs:99-101)；出厂各 10 (ConstantData.cs:211-217，与整数的 1000 :218-219、字符串的 100 :225-226 分档)；写入支 = changeVariableSizeData 的 `else if (id.IsFloat)` (ConstantData.cs:532-533)；消费支 = VariableData.cs:376-379 把这一格当 VariableLocal 的 size。容错口径与整数行**同一条链** (ConstantData.cs:313-357)：0 维(RESULTF) 拒 CanNotChange0DVarSize (:323-327)、0 长拒 ArrayLengthIs0 (:342-345)、负值因 LOCALF/ARGF 带 __CAN_FORBID__ 而改写成一整串 0 = 禁用数组 (:347-356)、IsLocal 下限是 1 而不是 100 (:363-367)、单维上限 1,000,000 (:374-378)、重复定义走 changedCode.Add 告警并以最后一次为准 (:541-542)、名字解析**区分大小写** (VariableIdentifier.cs:137-151,190 的 nameDic 以 Enum.GetName 为键 ⇒ CSV 写 localf,20 判未知名)。浮点**不参与**主数组↔名字表联动：decideActualArraySize (:583-670) 的 23 组联动 + PALAM/JUEL + CDFLAG 专例全部只读 int/str 表，整段 grep Float 零命中 ⇒ 改完即终值。2D/3D/角色浮点四张表 (VariableFloatArray2DLength/3D/CharacterFloatArrayLength/2D, :107-110) 在 fork 里初始化成**空数组** (:212-215，计数常量 :137-138/166-167/186 同为 0)，而名字表里没有对应的名字 ⇒ 那四条 IsFloat 写入支 (:493-494/:502-503/:513-514/:523-524) 在原版不可达，移植侧不建这四张表。语料读数 (2026-10-31 实测 eraTW4.981-261017-EAGLOV3)：CSV/VariableSize.csv 138 行**没有一条浮点行** ⇒ 该档在实机仍取出厂 10；ERB 全树 `#LOCALFSIZE` 0 处、ARGF 形参 0 处、LOCALF 用法仅 1 个文件 (DLC/魔法DLC/使用魔法.ERB:1248-1256 的裸名读写) ⇒ TODO(verify)：跳号形参 (ARGF:5) 与浮点禁用在 4.981 无对拍样本"
  save_note_classic: "经典(非二进制)存档尾段被 fork 追加 dataFloat(2 个 double) 与 dataFloatArray(7 个数组)：写 VariableData.cs:766-769、读 :792-795 ⇒ 与 4.980/1.824 的经典存档布局不兼容，跨版本读档会错位/抛 FileEE；二进制开关 SystemSaveInBinary 的默认值在 fork 配置文件里未核对 (TODO(verify)) —— 2026-10-31 [f3] 按 fork-src 锚点 commit 48494165 复核补记：fork 默认 **false**(ConfigData.cs:113 的 ConfigItem 第三参，同 :291)，但 eraTW4.981 随包 emuera.config 显式写 YES ⇒ 实机走二进制，尾段只在玩家手改配置时才生效。文本形态：标量一行一个 `value.ToString(「G」)`(当前文化，EraDataStream.cs:686-690)、读侧 `double.TryParse`(同样不带 InvariantCulture，:74-83)；数组写侧**逐个全写不截尾零**(与 long[] 的「截到最后非零」不同构，:719-727)，以 FINISHER 行收尾；读侧超出声明长度的行跳过、读到 FINISHER 后把剩余格子清 0.0(:113-133)。角色块的尾段次序不同：floatCount 标量夹在 intCount 与 intArrayCount **之间**(CharacterData.cs:393-408)，与全局段的「全部数组之后」不可混用。扩展区段集同理：fork 的角色扩展段由 6 段变 **9 段**(CharacterData.cs:437-503，浮点标量/1D/2D 各插在同类型之后，读侧同序 :505-515)、用户变量由 6 桶变 **9 桶**(VariableData.cs:858-876 普通档 / :1080-1101 全局档；桶号 = (Dimension-1)*3 + kindIdx，声明期 :499-505 ⇒ 浮点落桶 2/5/8，读侧 :936-944 / :1103-1113)、**系统扩展段两边都还是 8 段**(fork VariableData.cs:798-856 没给系统区加浮点，系统浮点只走上面的经典尾段)。两版扩展区标记同为 __EMUERA_1808_STRAT__(EraDataStream.cs:49 / :674，读侧 emu_version=1808 :198-200) ⇒ 段集**无法从盘上判**：移植侧由 SaveConfig.textExtensionSegments 显式声明(默认 4.980 六段 ⇒ 产物字节不变，尾段本身不能当版本信号，因为写侧无条件带尾段)。空段与零规则：fork 里带 SAVE_EXTENDED 的 19 个系统 code 全是 int/str(VariableCode.cs:96-202) ⇒ GetExtSaveList(Float, *) 为空(VariableIdentifier.cs:214-220)，系统/角色的浮点段恒为一个孤立分隔符行、段里真有值也只被消费不落条目(查表赋值 VariableData.cs:892-931)；用户浮点只有 1 维可达(#DIMF 声明期只 case 1，VariableData.cs:469-473) ⇒ FLT2/FLT3 两段亦恒空。浮点扩展项文本形态：标量 key:G 且 **0.0 不落**(EraDataStream.cs:776-783)、1D **截到最后一个非零项**(:949-966，与经典尾段的「逐个全写」不同构)、2D 整行零落空行(:968-1008)、3D 每平面 i{ … } 收尾(:1011-1067)；2D/3D 浮点段同受 emu_version 早退门槛(<1708 / <1729 直接返回，:539-540 / :584-585)，0 维与 1 维浮点 reader(:257 / :499) 无门槛"
  save_note_extended: "扩展存档新增 4 个类型标记 EraSaveDataType.Float=0x04 / FloatArray=0x05 / FloatArray2D=0x06 / FloatArray3D=0x07 (EraBinaryDataReader.cs:21-34)；写分支 EraBinaryDataWriter.cs:132-170；读分支 VariableData.cs:1486-1554(尺寸不匹配时按读出的维度丢弃多余元素) —— 2026-10-31 [f3] 逐行复核的编码与容错口径：①编码是**裸 8 字节小端 IEEE-754**(`writer.Write(double)`/`reader.ReadDouble()`，EraBinaryDataReader.cs:170,283-285)，数组前缀为定长 Int32 长度/维度，**既无整数的变长整数、也无 0 游程标记与结尾 0xFF**，全零元素照写(:138-146)；浮点不进 SparseArray 压缩路径(写侧 `GetArray()` 交出 double[] 直发，:1236-1253/:1267-1284)。②池侧容错与整数数组**不同**：只搬 `min(文件, 声明)` 区间，区间之后一个字节都不碰 ⇒ 声明更长时尾段**保持旧值**、不清零(:1510-1512)；档更长时多余元素「读掉即丢」(:1511-1512/:1530/:1551)。③多维按**流位置**落位(`for i0<len0 for i1<len1 arr[i0,i1]=ReadDouble()`, :1526-1529)：档内行宽 d1 与落位行宽 len1 不等时整块斜铺 —— fork 既有行为，按 ADR-005 原样复刻。④类型/维度守卫四条 case 各自先验 `IsFloat` + `Dimension`(:1487/1493/1518/1536)，不符整条丢弃；`default:` 抛 FileEE(AbnormalData)(:1555-1556)。⑤角色块同样发 0x04-0x07(CharacterData.cs:649-659)，读侧的 `SparseArray<double>` 分支在池满时会把 saveLen 之外的格子落成 0.0(:816-841)，与全局段的「保持旧值」是两条不同路径"

