# 用户自定义变量 (#DIM 系列) —— 生命周期与作用域
scoping:
  parse: "UserDefinedVariableData.Create 解析 #DIM/#DIMS/#DIMF 关键字: CONST/REF/OUT/DYNAMIC/STATIC/GLOBAL/SAVEDATA/CHARADATA, 冲突即 CodeEE (UserDefinedVariableData.cs:44-264; fork-src 增 OUT 与浮点型, UserDefinedVariable.cs:29-41, 71-264; 行号分割点 LogicalLineParser.cs:269-302)"
  dimension: "逗号分隔的尺寸参数; 缺省 [1]; 单维上限 1,000,000; 总元素数 ≤1,000,000; 维度 ≤3 (4D 报错), CHARADATA ≤2 维 (UserDefinedVariableData.cs:291-341, 437-449)"
  initial_value: "= 后可跟常量初值表; 初值必须编译为 SingleTerm 常量; CONST 要求初值数 == 长度 (UserDefinedVariableData.cs:344-427)"
  private_static: "#DIM (函数内, isPrivate=true) 默认 Static=true; STATIC/DYNAMIC 显式指定; 函数外不允许 STATIC/DYNAMIC 关键字 (UserDefinedVariableData.cs:119-170)"
  static_token: "Static*VariableToken: IsStatic=true, 全进程单份, SetDefault 时清零并回填 defArray; ScopeIn/ScopeOut 为空操作 (VariableData.cs:1295-1386, 1466-1472)"
  private_dynamic: "Private*VariableToken: ScopeIn 时旧数组压栈并新建(回填初值), ScopeOut 时弹栈恢复——实现函数调用的动态作用域嵌套 (VariableData.cs:1820-1901, 2131-2154)"
  global: "#DIM GLOBAL: 注册入 userDefinedGlobalVarList, 随全局存档写 (VariableData.cs:3265-3272, 3971-3977); SAVEDATA 入 userDefinedSaveVarList 按 [维度*2-2(+整数+1)] 分桶 (VariableData.cs:3273-3288)"
  savedata_str_limit: "非二进制存档 (SystemSaveInBinary=false) 时: 全局 SAVEDATA 字符串变量维度>1 或 CHARADATA 字符串变量 → 报错 (UserDefinedVariableData.cs:465-475)"
  chara: "#DIM CHARADATA: CreateUserDefCharaVariable 建用户角色变量, 每个角色 CharacterData.UserDefCVarDataList[ArrayIndex] 独立数组; CHARADATA 与 GLOBAL/SAVEDATA/CONST/REF 互斥 (VariableData.cs:3220-3244; UserDefinedVariableData.cs:62-77, 251-260)"
  ref: "#DIMREF (#DIM REF): 引用变量, 绑定目标数组; REF 不得与 CONST/GLOBAL/SAVEDATA/CHARADATA 同用; 不得有初值; 尺寸只能写 0 (UserDefinedVariableData.cs:89-117, 309-335, 357-364); ERH 中的 REF 直接 NotImplCodeEE (ErhLoader.cs:262-265); 空引用读取抛 EmptyRefVar (VariableData.cs:2325-2332)"
  const: "#DIMCONST: 必须有初值, 不可多维 (UserDefinedVariableData.cs:294-298, 438-441); 赋值抛 AssignToConst"
  dimf: "fork-src #DIMF: 变量类型标 float (TypeIsFloat), 但仅 1 维可建 token; 2D/3D/0 维在注册时抛 ExeEE(AbnormalVarDeclaration) (UserDefinedVariable.cs:71-78; VariableData.cs:469-474, 554-561, 586-593); 与 CONST/GLOBAL/SAVEDATA/STATIC/DYNAMIC 的关键字互斥规则沿用整数版 (UserDefinedVariable.cs:91-264); CHARADATA 浮点无专属 token, 掉进整数分支 (VariableData.cs:410-429)"
  reff: "fork-src #REFF: 浮点引用标量, 只有 0 维 (LogicalLineParser.cs:286-302; UserDefinedVariable.cs:29-41; VariableData.cs:451-456 全局, 519-526 私有); #DIMREF 的整数/字符串多维规则不变"
  local_scope_note: "函数内 #DIM 非 DYNAMIC(即 Static) 时行为等同全局静态单份 (CreatePrivateVariable 走 Static 分支并加入 userDefinedStaticVarList, VariableData.cs:3327-3343)"

# ─────────────────────────────────────────────────────────────
# 装载期 #DIM/#DIMS 初值折叠口径（2026-11-05 补登，来源 = lane bitvar 交来的 4.981 上报簇
# 「未定义的变量 COM641_AC_カードタイプ付与BIT配列」46 份 / 28 机 / app 0.2.39）。
# 下列每条都由本路逐行回 reference 复核后落笔；实现侧的对应件在文末 port_impl / pinning_tests。
# ─────────────────────────────────────────────────────────────
dim_const_fold:
  operator_layers: "`#DIM`/`#DIMS` 的初值段（含 CONST 初值表）与运行期表达式共用同一套算符层。词法**贪长**匹配：spec: MinorShift.Emuera.Runtime.Script.Parser/LexicalAnalyzer.cs:486-492（`&&` 命中 And，否则单 `&` → BitAnd）、:479-485（`||` → Or，单 `|` → BitOr）、:493-499（`^^` → Xor，单 `^` → BitXor）、:461-463/:473-475（`<<`/`>>`）⇒ 单字符 `&`/`|`/`^` 一律是**按位**运算，双字符才是逻辑层（And/Or/Xor：非 0 判真、结果只取 0/1，另有 `!&`/`!|` = Nand/Nor）。**单竖线既不是逻辑或、也不是元素分隔符**。优先级写在 OperatorCode 的低位字节里（`__PRIORITY_MASK__` = 255，spec: OperatorCode.cs:6；取法 OperatorManager.cs:151-154 GetPriority）：位移 `<<`/`>>` = 112（OperatorCode.cs:34-35）> 按位 `&`/`|`/`^` = 80（:29-31，三者**同层**）> 逻辑 `&&`/`||`/`^^`/`!&`/`!|` = 64（:24-28）⇒ `1 << A | 1 << B` 折成 `(1<<A) | (1<<B)`。按位层三个方法都带 `CanRestructure = true`（spec: MinorShift.Emuera.Runtime.Script.Statements.Expression/OperatorMethodManager.cs:467-479 BitAndIntInt 的 :471 / :481-493 BitOrIntInt 的 :485 / :495-507 BitXorIntInt 的 :499；位移 :509-521/:523-535 的 :513/:527；注册段 :737-741；逻辑层注册 :732-736），两侧皆常量时**装载期就折成单值**。按位三层同为 80 ⇒ `a | b ^ c` 折成 `(a | b) ^ c`，**不许照 C 语言的 `&` > `^` > `|` 抄**。"
  associativity: "同优先级**左结合**：spec: ExpressionParser.cs:86-90 —— 读到运算符时 `while (lastPriority() >= priority) reduceLastThree();`，比较符是 `>=` 而不是 `>` ⇒ 同层先入栈的先约减。移植侧折叠链用 while 循环就地左折（见 port_impl）。"
  fold_gate: "初值必须折成常量：spec: MinorShift.Emuera.Runtime.Script.Data/UserDefinedVariableData.cs:375 `ExpressionParser.ReduceArguments(wc, ArgsEndWith.EoL, isDefine: false)` 取初值表 → :405 逐元素 `Restructure(GlobalStatic.EMediator)` → :406-408 结果不是 `SingleTerm` 即 `throw new CodeEE(Lang.Error.InitialValueOnlyConst.Text)`。另两条同段闸门：:410-412 初值类型与 `#DIMS`/`#DIM` 不符报 NotMatchVarTypeAndInitialValue；:386-388 `CONST` 要求初值个数恰等于声明长度（不等报 ConstInitialValueDifferentArraySize）。折叠动作本身在 spec: FunctionMethodTerm.cs:35-59，`:54` 要求 `method.CanRestructure` **且**全部实参已折成 SingleTerm 才 `GetValue(exm)`。标识符能否参与折叠取决于自己的标志：spec: UserDefinedVariableToken.cs:35 `base.CanRestructure = isConst` ⇒ 只有 `#DIM CONST` 用户变量可被后一条声明的初值式引用，非 CONST 的用户变量折不动、落 :406-408。"
  failure_disposition: "折叠失败 ⇒ **整条声明不注册**（不是编译错误、不是只丢初值、不是局部降级）。装载侧 spec: MinorShift.Emuera.Runtime.Script.Loader/ErhLoader.cs:249-340 `analyzeSharpDimLines`：`:261` 建 `UserDefinedVariableData.Create(dimLineWC)`，注册动作在 `:267-268`（`CreateUserDefVariable`/`CreateUserDefCharaVariable` + `idDic.AddUseDefinedVariable`）；一旦 Create 抛异常，`:328-332` 的 `catch (CodeEE)` 只做 `ParserMediator.Warn(codeEE.Message, dimLineWC.SC, 2)` 并置 `result = false`，**:267-268 整个被跳过** ⇒ 名字进不了标识符表。`IdentifierNotFoundCodeEE` 是另一条支路：`:315-321` 先把该行重新入队多跑一趟（为的是吃下跨文件的前向引用），当一整趟没有任何进展时（`:334-337` `dimlines.Count == count` ⇒ `flag = false`）才在 `:324` 同样 Warn 后放弃 ⇒ 结局一致：不注册。运行期表现为**读到该名报「未定义的变量」**，而不是屏上出现装载期原文；移植侧抛点 `core/vars/VariableRegistry.kt:531` 与 `core/vars/VariableStore.kt:649/:652/:655`。本簇的移植侧成因：修复前本仓把单 `|` 按逻辑层折，COM641 那条声明报「尺寸/初值表达式有多余内容」后整表丢弃（同 :328-332 通道），即上报里那 46 份 / 28 机；由 34e307e9 / 872b5934（2026-11-04）修正，失败方向已由 Com641ProductionChainDimLoadPinTest 的第 3 例钉死。"
  erh_block_merge: "ERH 里跨行的 `{ … }` 初值块在**读行层**合并成一条逻辑行：spec: MinorShift.Emuera.Sub/EraStreamReader.cs:130-184 —— :136-141 只有 trim 后恰为 `{` 的行才开块（有尾巴字符报 CharacterAfterContinuation）；:143-180 逐行读到 trim 后恰为 `}` 的行为止（`}` 行带杂字 → CodeEE :165-171；块内再出现 `{` → CodeEE :173-176；到 EOF 仍未收口 → CodeEE :146-149），每段正文之后插 `Config.ReplaceContinuationBR`（:178-179）；:181 用合并串新建 CharStream ⇒ 声明行与块体属于**同一条**逻辑行，`#DIM … =` 后面为空、内容全在块里也成立。合并后逻辑行的行号 = **收块行（`}` 那一行）的物理行**：spec: 同文件 :77-87 `ReadLine()` 每读一行把 `curNo` 推到该行（`LineNo => curNo` 见 :30，**0 基**），块循环里的 :145 继续调用 ReadLine，break 时 curNo 停在 `}` 那一行。4.981 真形：COMF641 アビリティカード_カードパラメータ.ERH 的 `{` 在 1 基 :225、声明行 `#DIM CONST COM641_AC_カードタイプ付与BIT配列 =` 在 :226、33 个元素在 :227-:259、`}` 在 :260 ⇒ 合并逻辑行 = 1 基 :260（0 基 259）；被引用的五个标量 CONST（ステータス補助 0 / 戦闘補助 1 / 技能補助 2 / うふふ補助 3 / 特殊効果 10）在同文件 :209-:213。移植侧同一口径在 `core/lexer/LogicalLineReader.kt`，行号读数钉在 `core/compile/Com641ProductionChainDimLoadPinTest.kt:62-63`（`MERGED_LOGICAL_LINE = 259`）。"
  corpus_census: "语料普查读数（2026-11-05 本路自扫 eraTW4.981-261017-EAGLOV3，口径：4,258 个 ERB/ERH，其中 186 个 .ERH；「单竖线」= 左右均非竖线的 `|`）：含单竖线的 **ERH 行只有 14 行**，分布为 —— 10 行 = COMF641 アビリティカード_カードパラメータ.ERH 的 `{ }` 初值块内（1 基 :228/:229/:230/:231/:251/:254/:255/:256/:258/:259，竖线是**刻意的按位或**，该文件 :223 的注释写明「|で挟むことで複数属性を付与可能」）；3 行是纯注释行（`DIM.ERH:960`、`Headers/TASTE_TAGS.ERH:3`、上述 ERH 的 :223）；1 行 = `fromEN/TR_VARS.ERH:46`，该行本身是**活语句** `#DIM CONST CT_EXCLUDED_THE = 1`，单竖线只出现在它行尾的 `;` 注释里。放宽到全部 ERB+ERH：**带活竖线的单行 #DIM/#DIMS/#DIMF 声明 = 0 条**（`;` 起整行丢弃、不进词法，spec: LexicalAnalyzer.cs:919-933；`DIM.ERH:960` 即 `fromEN/TR_VARS.ERH:46` 的注释掉版本）。⇒ 装载期按位折叠在现存语料里只被 COM641 那一条 `{ }` 块真实触发，无第二簇。"
  port_impl: "移植侧唯一一条 DIM 折叠链在 `core/vars/UserVariables.kt` 的私有 `Folder`（:1448）：`shiftExpr` :1602-1622（112 层 `<<`/`>>`）、`bitExpr` :1552-1572（80 层 `&`/`|`/`^` → and/or/xor）、`orAndExpr` :1574-1600（64 层 `&&`/`||`/`^^`/`!&`/`!|`，非 0 判真、只取 0/1）；词法贪长匹配 :1261-1273。erbcc 出包侧不另建第二份折叠器，经 `DimFunctionFolder`/`DimFunctionFolders`（同文件 :177/:184）复用这条链，消费点 `tools/erbcc/src/main/kotlin/com/eratw/port/erbcc/compile/CorpusCompile.kt:631`。"
  pinning_tests: "互指测试：`core/vars/DimFoldTest`（折叠链逐层）、`tools/erbcc/…/bridge/DimFoldParityTest` 与 `…/bridge/DimSpecValidationTest`（出包侧同口径）、`core/compile/Com641ProductionChainDimLoadPinTest`（真语料生产链：块合并 + 33 元素的按位期望值 + 合并逻辑行号 + 「修复前把单 `|` 按逻辑层折 ⇒ 整条声明丢弃」的失败方向）。"

# 数组语义
array_semantics:
  index_type: "所有下标为 64 位整数 long; 2D/3D 访问处用 checked nint 转换 (VariableData.cs:117, 213)"
  bounds_check: "CheckElement 逐维检查, 越界抛 CodeEE(OoRVarArg) (VariableData.cs:81-100, 173-183; CharaVariableToken.cs:56-70; UserDefinedVariableToken.cs:58-72); SP/范围指令另有 IsArrayRangeValid (含端点=size 合法, 用于区间赋值)"
  chara_index_check: "角色变量第 1 参先对 CharacterList.Count 检查 (CharaVariableToken.cs:56-61)"
  forbid: "尺寸为 0 的数组 IsForbid=true, 常量数组同理 (VariableData.cs:25, 112, 676); 存档加载时 IsForbid 名字直接丢弃 (VariableData.cs:4085-4092)"
  varsize: "VARSIZE 经 GetLength(dimension) 实现: 1D 返回长度, 2D/3D 按维返回, 0 维与伪变量抛错 (VariableData.cs:62-74, 154-166, 202-210; VariableToken.cs:202-210)"
  range_assign: "批量赋值 SetValue(values, args) 从指定下标起连续覆盖, 调用方须先过 IsArrayRangeValid (VariableData.cs:38-46 等)"
  setvalueall: "1D 区间 [start,end); 2D/3D 全元素 (VariableData.cs:48-54, 135-146); 私有动态变量在无值时不初始化 (SetDefault 空实现, VariableData.cs:1836-1838)"
  chara_sort_stability: "AscCharacterComparison: 键值比较结果非 0 时返回之, 否则按 temp_CurrentOrder (装载时的位置) 保证稳定 (CharacterData.cs:772-780)"

