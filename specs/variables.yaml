  - {name: TSTR,    index: 6, size: 100,   saved: false, global: false, source: "VariableData.cs:3069", note: "同 RESULTS, 不入经典存档"}
  - {name: SAVEDATA_TEXT, index: -, size: 1, saved: true, global: false, source: "VariableData.cs:3073", note: "0 维字符串 (StrVariableToken, 直接 dataString[VarCodeInt], VariableData.cs:303-329); dataString 长度 1 (VariableData.cs:2968)"}

# 多维（2D/3D）系统整数数组 —— 2026-10-19 spec 与 C# 交叉验证补条目
# 此前这 8 个名字只在 default_sizes 的合并说明里以注释形式出现过（"全部 (100,100)  # DITEMTYPE/DA-DE"），
# 没有逐条登记 ⇒ spec_crosscheck.py 的 varTokenDic 全集比对判为缺条目。
# 登记依据（逐条行号）：VariableData.cs:3103-3110 的 varTokenDic.Add；
# 尺寸打包常量：2D = 429496729700L ⇒ (100,100)（ConstantData.cs:224-226），
#              3D = 109951267635300L ⇒ (100,100,100)（ConstantData.cs:232-234）；
# 建数组：VariableData.cs:2977（2D）/ :2993（3D）。
# saved 判定：这 8 个 VariableCode 值（DITEMTYPE=419627008 … DE=419627013、TA=822280192、TB=822280193）
#   都带 __SAVE_EXTENDED__(268435456) 位 ⇒ IsSavedata=true 走**扩展存档**名字-值对，不入经典定长段
#   （VariableToken.cs:93-96 命中，:103 的 `Code & 673054720` switch 不参与）。
multi_dim_arrays:
  - {name: DITEMTYPE, dim: 2, index: 0, size: "(100,100)", saved: true,  global: false, source: "VariableData.cs:3103; ConstantData.cs:224-226; VariableData.cs:2977", note: "Int2DVariableToken; VarCodeInt = 低 16 位 (VariableCode.cs:142)"}
  - {name: DA,        dim: 2, index: 1, size: "(100,100)", saved: true,  global: false, source: "VariableData.cs:3104; VariableCode.cs:143"}
  - {name: DB,        dim: 2, index: 2, size: "(100,100)", saved: true,  global: false, source: "VariableData.cs:3105; VariableCode.cs:144"}
  - {name: DC,        dim: 2, index: 3, size: "(100,100)", saved: true,  global: false, source: "VariableData.cs:3106; VariableCode.cs:145"}
  - {name: DD,        dim: 2, index: 4, size: "(100,100)", saved: true,  global: false, source: "VariableData.cs:3107; VariableCode.cs:146"}
  - {name: DE,        dim: 2, index: 5, size: "(100,100)", saved: true,  global: false, source: "VariableData.cs:3108; VariableCode.cs:147"}
  - {name: TA,        dim: 3, index: 0, size: "(100,100,100)", saved: true, global: false, source: "VariableData.cs:3109; ConstantData.cs:232-234; VariableData.cs:2993", note: "Int3DVariableToken (VariableCode.cs:150)"}
  - {name: TB,        dim: 3, index: 1, size: "(100,100,100)", saved: true, global: false, source: "VariableData.cs:3110; VariableCode.cs:151"}


