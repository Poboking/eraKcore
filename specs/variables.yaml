local_vars:
  - {name: LOCAL,  index: 61, size: 1000, source: "VariableData.cs:3180-3183", note: "LocalVariableToken 按 subId(函数名) 创建 (VariableData.cs:3190-3193); 数组懒初始化 (VariableData.cs:1148-1155)"}
  - {name: ARG,    index: 62, size: 1000, source: "VariableData.cs:3183"}
  - {name: LOCALS, index: 3,  size: 100,  source: "VariableData.cs:3184-3187"}
  - {name: ARGS,   index: 4,  size: 100,  source: "VariableData.cs:3187"}
  - {name: LOCALF, index: 0, size: 10, source: "fork-src VariableData.cs:376-377; ConstantData.cs:211-217; VariableCode.cs:99", note: "fork 新增的浮点局部数组(double[]，非 SparseArray); 默认长 10 可被 VARIABLESIZE.CSV 改写 (ConstantData.cs:532-533); #LOCALFSIZE 按函数拉大 (LogicalLineParser.cs:257-266); 实际分配在 ExecutionContext.LocalFloats (ExecutionContext.cs:29,55-62; VariableToken.cs:1894)"}
