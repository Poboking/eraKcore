  - id: CanNotRenameKey
    lang_cs: 3594
    zhs_xml: 853
    args: 1
    status: registered
    used_at: 无（同上，移植侧未走 rename 符号通道，接线待组长裁定）
    ja: |-
      字句解析中に置換(rename)できない符号{0}を発見しました
    zhs: |-
      发现词法解析中无法被替换(rename)的符号{0}

