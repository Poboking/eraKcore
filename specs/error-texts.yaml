# 原版 Lang.Error 文案表 —— 词法 / ArgumentBuilder / 块结构三族
#
# 权威来源（只读参考仓）：
#   - 日文原文：MinorShift.Emuera.Runtime.Utils.EvilMask/Lang.cs
#   - 中文译文：MinorShift.Emuera.Properties.lang.emuera-zhs.xml
#   - 调用点：MinorShift.Emuera.GameProc.Function/ArgumentBuilder.cs、ArgumentParser.cs、
#             MinorShift.Emuera.Runtime.Script.Loader/ErbLoader.cs
#
# 代码侧镜像：core/lexer/LangText.kt 的 enum LangKey。本文件与它由
# core-vm 的 ErrorTextRenderTest 双向对账（id 集合、ja/zhs 模板、占位符个数、两侧行号），
# 任何一侧漂了都会红。
#
# 语言口径（编译层缺陷收口波 L11 裁定）：
#   - 内核/契约层报错取 ja：Lang.cs 日文原文，{0} 照常展开（LexError / LexWarning 走这档）；
#   - 使用者面诊断取 zhs：lang.emuera-zhs.xml 译文（BlockChecker、ArgBuilders 的 warn/fail）；
#   - 照抄纪律：只做按序号原位替换，不 trim、不改引号形态、不修误译（ADR-005）。
#
# 字段：
#   id          Lang.Error 的键名（去掉 Error. 前缀）
#   lang_cs     Lang.cs 行号（日文原文）
#   zhs_xml     **仓内 reference 内嵌表**的行号 =
#               `reference/emuera-cs/MinorShift.Emuera.Properties.lang.emuera-zhs.xml`
#   zhs_root_xml 语料根表的行号 =
#               `eratw-画蛇添足版eratw4.980/lang/emuera.zhs.xml`（只随附录段一起记，
#               不参与对账：该表不在仓内、随共享根走）
#   args        占位符个数 = string.Format 实参个数
#   status      wired = 本轮已接线；registered = 键已登记、调用点仍用旧串（见 used_at）
#   used_at     抛出点锚，**一律不写行号**，形如
#               `<core 相对路径> <函数/符号> 的「<needle>」`；同一枚键有多个抛点时用
#               `+` 串接，**每个「」绑定到它左边最近的那个 `.kt`**。needle 取的是产品
#               文件里必须逐字命中的原文，按接线状态分三档：
#                 - 已走通道的键 → 写 `LangKey.<键名>`（调用式，如 `LangKey.MissingArg`）；
#                 - 判「不改-同形」未入通道的键 → 写屏上原文的**静态前缀**（不带 `${}` 插值段）；
#                 - 尚未接线的键 → 写**将来落点的函数名**（如 `private fun changeable`）。
#               路径一律相对 `core-vm/src/main/kotlin/com/eratw/port/core/`（`sem/`、`stmt/`、
#               `vars/`、`err/`、`fn/`、`lexer/`、`code/`、`frontend/`、`data/save/`）。
#               没有「」的条目 = 本条无可核锚点（无消费点 / 未移植 / 待接线），闸会打印清单。
#               为什么不留行号：行号每次重构必漂，且**过去没有任何闸核对过它**。2026-11-05
#               lane usedat 全量对账读数：97 条里 70 条带 `文件.kt:行号`、共 100 处行号，
#               其中 67 处已指不到对应抛点（20 处干脆指在注释行上），落到条目级是
#               50 条漂移 / 20 条仍准（BlockChecker 11、VarErrorText 4、OperatorErrorText 3、
#               CharaFileIO 2 全准；ArgBuilders 13、LexicalAnalyzer 4、LineParser 2 全错）。
#               ⇒ 反向核对闸见 core-vm 的 LangKeyUsedAtAnchorTest，钉「文件 + needle 在位」，
#               不钉行号（钉行号 = 再造一个必然漂的闸）。
#   ja / zhs    模板原文（{0} 未展开；块标量 |- 保留逐字内容）
#
# ## `zhs_xml` 到底索引哪张表（2026-11-05 lane errtext4 实测，别再猜）
# 两张 zhs 表**同文、不同行号**，本字段一路吃的是 **reference 内嵌表**：
#   - `MacroOverLimit`：reference 表 :843（本表记的就是 843）；语料根表 :455；
#     而语料根表的 :843 是 `SystemLine.DoYouOverwrite` ⇒ 按语料根表读会整族错位。
#   - 全量复核：本文件 42 条既有条目逐条回读 reference 表 `zhs_xml` 那一行，
#     `tr id` 与 CDATA 文本 42/42 命中（同时 `lang_cs` 那一行的 `TranslatableString`
#     属性名与日文模板也是 42/42 命中）。闸见
#     `core-vm/src/test/kotlin/com/eratw/port/core/lexer/LangKeySourceTableTest.kt`。
#   - ⇒ 新条目一律按「reference 表行号进 `zhs_xml`、语料根表行号进 `zhs_root_xml`」登记，
#     并逐条自己验过两表同文才落（两表不同文的键按组长裁定不进本表）。

schema: 1

